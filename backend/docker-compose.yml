services:
  db:
    image: postgres:16-alpine
    container_name: checkly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkly
      POSTGRES_PASSWORD: checkly
      POSTGRES_DB: checkly
    ports:
      - "5432:5432"
    volumes:
      - checkly-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkly -d checkly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  checkly-db-data: